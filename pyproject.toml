[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organic-geometry-workbench"
version = "0.2.0"
description = "A practical Python-first curriculum in implicit organic geometry"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-image>=0.21", "trimesh>=4", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["organic*"]
